# The listings of catalog (migration-strategy.md, "Planned initial migrations"): MVP 1 has
# no path that creates a property, so this seed is required in every environment and
# carries no context. The rows are the ones property-catalog-portal/dev/mock-api.mjs
# served to the portal, with the same ids, so links and tests keep working.
# Idempotent (Annex B, rule 3): one upsert per property. $set rewrites the listing data;
# $setOnInsert writes unavailableRanges and createdAt only when the property is new, so
# running it again never erases a range that catalog-api already applied.
# No photos yet: the mock drew them itself, and no environment serves those files.
